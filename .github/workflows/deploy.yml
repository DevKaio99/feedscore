name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-feedscore
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: feedscore

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rodar testes (unitarios, contrato e integracao com LocalStack)
        run: ./mvnw -B clean verify

  deploy:
    name: Build nativo e deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build nativo das tres funcoes
        run: ./mvnw -B package -Dnative -Dquarkus.native.container-build=true -DskipTests

      - name: SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Credenciais temporarias da AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy com SAM
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --s3-prefix "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --role-arn "${{ secrets.AWS_CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides \
              "SesSender=${{ secrets.SES_SENDER }}" \
              "SesRecipients=${{ secrets.SES_RECIPIENTS }}" \
              "AlarmEmail=${{ secrets.ALARM_EMAIL }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset