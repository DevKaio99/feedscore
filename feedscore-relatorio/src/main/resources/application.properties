# Porta do simulador de Lambda (o recebimento usa 8080 e a notificação, 8082)
quarkus.lambda.mock-event-server.dev-port=8083

# Scripts de inicialização do LocalStack
quarkus.aws.devservices.localstack.init-scripts-classpath=localstack-init
quarkus.aws.devservices.localstack.init-completion-msg=FeedScore init concluido

# DynamoDB
feedscore.dynamodb.table-name=${FEEDSCORE_TABLE_NAME:feedscore-feedbacks}

# E-mail
feedscore.ses.sender=${FEEDSCORE_SES_SENDER:alertas@feedscore.local}
feedscore.ses.recipients=${FEEDSCORE_SES_RECIPIENTS:admin@feedscore.local}