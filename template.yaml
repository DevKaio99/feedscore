AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FeedScore - plataforma serverless de feedback de aulas

Parameters:
  SesSender:
    Type: String
    Description: E-mail verificado no SES usado como remetente
  SesRecipients:
    Type: String
    Description: E-mails dos administradores, separados por virgula, verificados no SES
  AlarmEmail:
    Type: String
    Description: E-mail que recebe as notificacoes dos alarmes de monitoramento

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Handler: not.used.in.provided.runtime
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        DISABLE_SIGNAL_HANDLERS: true
    Tags:
      Project: feedscore

Resources:
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-feedbacks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: week
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: week-createdAt-index
          KeySchema:
            - AttributeName: week
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: feedscore

  CriticalFeedbackDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: !Sub ${AWS::StackName}-critical-feedbacks-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: feedscore

  CriticalFeedbackQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: !Sub ${AWS::StackName}-critical-feedbacks
        VisibilityTimeout: 90
        MessageRetentionPeriod: 345600
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt CriticalFeedbackDLQ.Arn
          maxReceiveCount: 3
        Tags:
          - Key: Project
            Value: feedscore

  FeedbackApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: prod
      OpenApiVersion: '3.0.1'
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub ${AWS::StackName}-usage-plan
          Throttle:
            RateLimit: 5
            BurstLimit: 10
          Quota:
            Limit: 1000
            Period: DAY
      Tags:
        Project: feedscore

  ReceiveFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-recebimento
      Description: Recebe a avaliacao, grava no DynamoDB e publica as criticas na fila
      CodeUri: feedscore-recebimento/target/function.zip
      Environment:
        Variables:
          FEEDSCORE_TABLE_NAME: !Ref FeedbackTable
          FEEDSCORE_QUEUE_URL: !Ref CriticalFeedbackQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FeedbackTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt CriticalFeedbackQueue.Arn
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref FeedbackApi
            Path: /avaliacao
            Method: post

  NotifyCriticalFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-notificacao
      Description: Consome a fila de criticos e envia o alerta por e-mail aos administradores
      CodeUri: feedscore-notificacao/target/function.zip
      Environment:
        Variables:
          FEEDSCORE_SES_SENDER: !Ref SesSender
          FEEDSCORE_SES_RECIPIENTS: !Ref SesRecipients
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesSender
      Events:
        CriticalFeedbackQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CriticalFeedbackQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  WeeklyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-relatorio
      Description: Gera o relatorio da semana anterior e envia por e-mail
      CodeUri: feedscore-relatorio/target/function.zip
      Timeout: 30
      Environment:
        Variables:
          FEEDSCORE_TABLE_NAME: !Ref FeedbackTable
          FEEDSCORE_SES_SENDER: !Ref SesSender
          FEEDSCORE_SES_RECIPIENTS: !Ref SesRecipients
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${FeedbackTable.Arn}/index/week-createdAt-index
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesSender
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Name: !Sub ${AWS::StackName}-relatorio-semanal
            Description: Toda segunda-feira as 08h de Brasilia (11h UTC)
            Schedule: cron(0 11 ? * MON *)
            Enabled: true

  ReceiveFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReceiveFeedbackFunction}
      RetentionInDays: 7

  NotifyCriticalFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NotifyCriticalFeedbackFunction}
      RetentionInDays: 7

  WeeklyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WeeklyReportFunction}
      RetentionInDays: 7

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alarmes
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail
      Tags:
        - Key: Project
          Value: feedscore

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-erros-5xx
      AlarmDescription: A API respondeu com erro 5xx (falha no recebimento de avaliacoes)
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ReceiveFeedbackErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-recebimento-erros
      AlarmDescription: A funcao de recebimento falhou (timeout ou erro de inicializacao)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReceiveFeedbackFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  NotifyCriticalFeedbackErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-notificacao-erros
      AlarmDescription: A funcao de notificacao falhou (timeout ou erro de inicializacao)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotifyCriticalFeedbackFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CriticalFeedbackDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dlq-mensagens
      AlarmDescription: Alerta critico nao enviado apos 3 tentativas (mensagem na DLQ)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CriticalFeedbackDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  WeeklyReportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-relatorio-erros
      AlarmDescription: O relatorio semanal falhou e nao sera reenviado automaticamente
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WeeklyReportFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API - requisicoes e erros",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Filas - criticos publicados e DLQ",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/SQS", "NumberOfMessagesSent", "QueueName", "${CriticalFeedbackQueue.QueueName}", {"stat": "Sum", "label": "Criticos publicados"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${CriticalFeedbackDLQ.QueueName}", {"stat": "Maximum", "label": "Mensagens na DLQ"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Lambdas - invocacoes",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ReceiveFeedbackFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotifyCriticalFeedbackFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${WeeklyReportFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Lambdas - erros",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ReceiveFeedbackFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotifyCriticalFeedbackFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${WeeklyReportFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Lambdas - duracao media (ms)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ReceiveFeedbackFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${NotifyCriticalFeedbackFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${WeeklyReportFunction}"]
                ]
              }
            },
            {
              "type": "alarm", "x": 0, "y": 12, "width": 24, "height": 3,
              "properties": {
                "title": "Estado dos alarmes",
                "alarms": [
                  "${ApiServerErrorsAlarm.Arn}",
                  "${ReceiveFeedbackErrorsAlarm.Arn}",
                  "${NotifyCriticalFeedbackErrorsAlarm.Arn}",
                  "${CriticalFeedbackDLQAlarm.Arn}",
                  "${WeeklyReportErrorsAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: URL do endpoint de avaliacao
    Value: !Sub https://${FeedbackApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao
  ApiKeyId:
    Description: ID da API key (use o CLI para obter o valor)
    Value: !Ref FeedbackApiApiKey